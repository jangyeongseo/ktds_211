<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naver</title>
    <link rel="stylesheet" href="./naver.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
    <div class="container">
        <!-- 아이디 / 비밀번호 / 이메일 -->
        <div class="basic-info">
            <div class="box">
                <div class="join-box user">
                    <input type="text" placeholder="아이디">
                </div>
                <span>@naver.com</span>
            </div>

            <div class="box">
                <div class="join-box password">
                    <input type="password" placeholder="비밀번호">
                </div>
                <span class="material-symbols-outlined">visibility_off</span>
            </div>

            <div class="box">
                <div class="join-box email">
                    <input type="text" placeholder="[선택] 이메일 주소">
                </div>
            </div>
        </div>

        <!-- 이름 / 생년월일 / 성별 -->
        <div class="personal">
            <div class="box">
                <div class="join-box user">
                    <input type="text" placeholder="이름">
                </div>
            </div>

            <div class="box">
                <div class="join-box birthday">
                    <input type="text" maxlength="8" placeholder="생년월일 8자리">
                </div>
            </div>

            <div class="box">
                <div class="join-box communication">
                    <input type="text" maxlength="8" placeholder="통신사 선택">
                </div>
            </div>

            <div class="box gender-box">
                <div class="gender">
                    <div>
                        <input type="radio" name="gender" id="boy">
                        <label for="boy">남자</label>

                        <input type="radio" name="gender" id="girl">
                        <label for="girl">여자</label>
                    </div>

                    <div>
                        <input type="radio" name="gender" id="local">
                        <label for="local">내국인</label>

                        <input type="radio" name="gender" id="foreign">
                        <label for="foreign">외국인</label>
                    </div>
                </div>
            </div>
        </div>

        <span class="description">
            신분증 상의 이름, 생년월일, 성별과 일치하지 않으면 실명인증이 불가합니다.
        </span>


        <!-- 휴대폰 -->
        <div class="tel-info box">
            <div class="join-box phon">
                <input type="tel" name="phon" id="phon" placeholder="휴대전화번호" />
            </div>
        </div>

        <!-- 필수 약관 전체동의 -->
        <div class=" agreement-info">
            <select>
                <option>대한민국 +82</option>
            </select>
        </div>
    </div>
</body>

</html>
