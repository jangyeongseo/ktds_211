<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 실행 방법</title>
    <link rel="stylesheet" type="text/css" href="./01_script_type.css">
    <script type="text/javascript" src="./01_script_type.js"></script> <!-- External Script -->
</head>

<body>
    <div class="clickable-box">
        <fieldset>
            <legend>Click Me!</legend>
            <p>
                // 브라우저가 파일을 모두 읽어서 모든 태그의 DOM 생성을 완료한 이후! <br />
                // 브라우저에 화면을 그리기 직전!
                window.onload = function () {
                // Internal Script
                }
            </p>
        </fieldset>
    </div>
    <button class="clickable-button">Click Me!</button>

    <!-- 아래에 있는 p태그를 클릭하면 "클릭했습니다" 콘솔에 출룍하기 -->
    <!-- inline Script -->
    <p onclick="console.log('클릭했습니다.')">zmfflgyrhk</p>

</body>

</html>
