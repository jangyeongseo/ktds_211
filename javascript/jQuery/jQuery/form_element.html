<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Form_Element 제어 실습</title>
  <script src="../jquery-4.0.0.slim.min.js"></script>
  <script type="text/javascript" src="./form_element.js"></script>
</head>

<body>
  <div class="page-123">
    <label for="email">이메일</label>
    <hr />
    <!-- value="jyeongseo82@gmail.com" - 일반적으로 이렇게 값을 집어넣는 경우는 잘 없다. -->
    <input type="email" id="email" placeholder="Email을 입력하세요." value="jyeongseo82@gmail.com" /><br />
  </div>

  <div class="page-124">
    <label for="jobs">직업</label>
    <hr />
    <select id="jobs">
      <!-- 
      value : 디비에 저장하기 위해 / 서버라는 곳으로 value 값을 전송하기 위해
      selected
      -->
      <option value="0">선택하세요.</option>
      <option value="1">회사원</option>
      <option value="2">학생</option>
      <option value="3">교수</option>
    </select>
  </div>

  <div class="page-125">
    <h1>Radio</h1>
    <input type="radio" name="age" id="age-10" value="10" />
    <label for="age-10">10대</label>

    <input type="radio" name="age" id="age-20" value="20" />
    <label for="age-20">20대</label>

    <input type="radio" name="age" id="age-30" value="30" />
    <label for="age-30">30대</label>

    <input type="radio" name="age" id="age-40" value="40" />
    <label for="age-40">40대</label>

    <h1>Checkbox</h1>
    <input type="checkbox" id="checked-all" />
    <label for="checked-all">전체선택</label>

    <!-- 
      속성은 값이 있는 것 - “attribute(속성)” 또는 “property(프로퍼티)
      checked 같은 것들을property(프로퍼티)라고 부른다.
    -->
    <input type="checkbox" name="favorate-genre" id="rock" value="rock" />
    <label for="rock">락</label>

    <input type="checkbox" name="favorate-genre" id="punk" value="punk" />
    <label for="punk">펑크</label>

    <input type="checkbox" name="favorate-genre" id="ballad" value="ballad" />
    <label for="ballad">발라드</label>

    <input type="checkbox" name="favorate-genre" id="rnb" value="rnb" />
    <label for="rnb">알앤비</label>
  </div>
</body>

</html>
