<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline style</title>
    <!-- 스타일 추적이 어렵다. 권장하지 않는 방법이다. -->
</head>

<body>
    <div id="header" style="background-color: lightblue; padding: 20px;">
        Header 영역
        <p class="header--logo">Logo</p>
    </div>
    <div id="main-container">
        Main Container 영역
        <p class="main-container--content"></p>
    </div>
    <div id="footer">
        Footer 영역
        <ul class="footer-links">
            <li class="footer-links--link">첫 번째 단락</li>
            <li class="footer-links--link">두 번째 단락</li>
            <li class="footer-links--link">세 번째 단락</li>
        </ul>
    </div>
</body>

</html>
