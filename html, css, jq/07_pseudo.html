<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link rel="stylesheet" type="text/css" href="./07_pseudo.css">
</head>

<body>
    <h1 class="section-title" style="color: lightcoral !important; ">Anchots</h1>
    <a href="http://www.google.com" class="anchor-link">Google</a>
    <a href="http://www.naver.com" class="anchor-link">Naver</a>
    <a href="http://www.daum.net" class="anchor-link">Daum</a>
    <a href="http://www.nate.com" class="anchor-link">Nate</a>


    <h1 class="section-title">Vertical List</h1>
    <!-- 세로 -->
    <ul class="vertical-list">
        <li class="vertical-item">Item 1</li>
        <li class="vertical-item">Item 2</li>
        <li class="vertical-item">Item 3</li>
        <li class="vertical-item">Item 4</li>
        <li class="vertical-item">Item 5</li>
    </ul>

    <h1 class="section-title">Horizontal List</h1>
    <!-- 가로 / 수평 -->
    <ul class="horizontal-list">
        <li class="horizontal-item">Item 1</li>
        <li class="horizontal-item">Item 2</li>
        <li class="horizontal-item">Item 3</li>
        <li class="horizontal-item">Item 4</li>
        <li class="horizontal-item">Item 5</li>
        <li class="horizontal-item">Item 6</li>
    </ul>

</body>

</html>
