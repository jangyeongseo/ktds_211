<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link rel="stylesheet" type="text/css" href="./06_list.css">
</head>

<body>
    <h1 class="section-title">Vertical List</h1>
    <!-- 세로 -->
    <ul class="vertical-list">
        <li class="vertical-item">Item 1</li>
        <li class="vertical-item">Item 2</li>
        <li class="vertical-item">Item 3</li>
    </ul>

    <h1 class="section-title">Horizontal List</h1>
    <!-- 가로 / 수평 -->
    <ol class="horizontal-list">
        <li class="horizontal-item">Item 1</li>
        <li class="horizontal-item">Item 2</li>
        <li class="horizontal-item">Item 3</li>
    </ol>

    <ul class="horizontal-list">
        <li class="horizontal-item">Item 1</li>
        <li class="horizontal-item">Item 2</li>
        <li class="horizontal-item">Item 3</li>
    </ul>

</body>

</html>
